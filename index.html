<!DOCTYPE html>
<html lang="en" class="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual" />
    <title>DevBoard — The note app that thinks visually</title>
    <meta name="description" content="Write notes, connect ideas with wikilinks and backlinks, then map the bigger picture on an infinite canvas. Local-first, with optional cloud sync." />
    <meta property="og:title" content="DevBoard — The note app that thinks visually" />
    <meta property="og:description" content="Markdown notes with wikilinks and backlinks, plus an infinite canvas for mapping connected ideas. Your files stay yours." />
    <meta property="og:image" content="https://raw.githubusercontent.com/mfgoes/Devboard/main/docs/assets_landing/main_board.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DevBoard — The note app that thinks visually" />
    <meta name="twitter:description" content="Markdown notes with wikilinks and backlinks, plus an infinite canvas for mapping connected ideas. Your files stay yours." />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/mfgoes/Devboard/main/docs/assets_landing/main_board.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        let theme = 'light';
        try {
          const stored = JSON.parse(localStorage.getItem('devboard-v2') || 'null');
          const storedTheme = stored && stored.state && stored.state.theme;
          if (storedTheme === 'dark' || storedTheme === 'light') theme = storedTheme;
        } catch {
          theme = 'light';
        }
        const root = document.documentElement;
        root.classList.toggle('light', theme === 'light');
        root.dataset.theme = theme;
        root.style.setProperty('--initial-bg', theme === 'light' ? '#f6f1ea' : '#1c1916');
      })();
    </script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; background: var(--initial-bg, #f6f1ea); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
