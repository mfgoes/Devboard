<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Contact | DevBoard</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    body {
      background: #0f1115;
      color: #e6eaf2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .contact-card {
      max-width: 720px;
      width: 100%;
      background: #171b22;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 48px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    }

    h1 {
      color: white;
      margin-bottom: 1rem;
    }

    p {
      color: #b8c0cc;
      line-height: 1.7;
    }

    a {
      color: #8ab4ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .email-box {
      margin-top: 2rem;
      padding: 16px 20px;
      background: rgba(255,255,255,0.04);
      border-radius: 14px;
      font-size: 1.05rem;
    }

    .back-link {
      display: inline-block;
      margin-top: 2rem;
      color: #8ab4ff;
    }
  </style>
</head>
<body>

  <div class="contact-card">

    <h1>Contact</h1>

    <p>
      DevBoard is an independent local-first note-taking and visual thinking app
      created by Mischa van der Goes.
    </p>

    <p>
      For support, feedback, bug reports, partnership inquiries,
      or general questions, you can reach out by email.
    </p>

    <div class="email-box">
      <strong>Email:</strong><br />
      <a href="mailto:mfgoes1@gmail.com">
        mfgoes1@gmail.com
      </a>
    </div>

    <a class="back-link" href="./index.html">
      ← Back to DevBoard
    </a>

  </div>

</body>
</html>
